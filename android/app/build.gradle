apply plugin: 'com.android.application'

// ── Release signing ──────────────────────────────────────────────────────────
// Credentials NEVER live in this file or in git. They are read from, in order:
//   1. android/keystore.properties  — local developer machine, gitignored
//   2. PIMA_KEYSTORE_* environment variables — CI / build server
//
// When none are present the release build stays unsigned exactly as it did
// before, so nothing that works today starts failing. Google Play rejects an
// unsigned bundle, so the mistake cannot reach production silently — but the
// warning below makes it obvious long before that.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def ksStoreFile = keystoreProps['storeFile']     ?: System.getenv('PIMA_KEYSTORE_FILE')
def ksStorePw   = keystoreProps['storePassword'] ?: System.getenv('PIMA_KEYSTORE_PASSWORD')
def ksKeyAlias  = keystoreProps['keyAlias']      ?: System.getenv('PIMA_KEY_ALIAS')
def ksKeyPw     = keystoreProps['keyPassword']   ?: System.getenv('PIMA_KEY_PASSWORD')

def resolvedKeystore = ksStoreFile ? rootProject.file(ksStoreFile) : null
def hasReleaseSigning = ksStoreFile && ksStorePw && ksKeyAlias && ksKeyPw &&
        resolvedKeystore != null && resolvedKeystore.exists()

if (!hasReleaseSigning) {
    logger.warn("[pima] No release signing credentials found — `assembleRelease`/`bundleRelease` " +
                "will produce an UNSIGNED artifact that Google Play will reject. " +
                "Create android/keystore.properties (see android/keystore.properties.example).")
}

android {
    namespace = "com.pimastay.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.pimastay.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile resolvedKeystore
                storePassword ksStorePw
                keyAlias ksKeyAlias
                keyPassword ksKeyPw
                // Play requires both; v1 keeps sideloaded installs working on
                // the older devices this app still supports (minSdk 24).
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
